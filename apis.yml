name: Akulaku
description: 'Akulaku is a Southeast Asian fintech and e-commerce platform serving Indonesia,
  the Philippines, Vietnam, and Malaysia, combining an online shopping marketplace with
  buy-now-pay-later (PayLater / Akucicil) installment credit and digital banking services.
  For merchants and partners it runs the Akulaku Open Platform (developer.akulaku.com),
  a vendor/seller integration surface exposing e-commerce and fulfillment APIs such as
  Add Item, Get Order Detail, and Init, alongside a Competence Center API set, a developer
  Console, and testing accounts to accelerate integration.'
